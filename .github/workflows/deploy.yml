name: CI – Build Check

# Vercel Git integration handles all deployments automatically:
#   main branch  → production deployment
#   dev branch   → preview deployment
#   pull requests → preview deployment
#
# This workflow only validates that the build succeeds before merging.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: nexus-erp/package-lock.json

      - name: Install dependencies
        run: |
          cd nexus-erp
          npm ci

      - name: Type check
        run: |
          cd nexus-erp
          npx tsc --noEmit

      - name: Build
        run: |
          cd nexus-erp
          npm run build
