name: Archive Audit Logs

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd nexus-erp
          npm ci

      - name: Run archive script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUDIT_RETENTION_DAYS: ${{ secrets.AUDIT_RETENTION_DAYS }}
        run: |
          node nexus-erp/scripts/archive-audit.js
