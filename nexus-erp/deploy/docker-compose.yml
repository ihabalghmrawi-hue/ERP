version: "3.9"

# ═══════════════════════════════════════════════════════════
#  NexusERP — Docker Compose (Production)
#  Usage: docker-compose -f deploy/docker-compose.yml up -d
# ═══════════════════════════════════════════════════════════

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nexus-erp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://app.nexuserp.com}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-NexusERP}
    env_file:
      - ../.env.production
    volumes:
      - app_logs:/app/logs
    networks:
      - nexus_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Nginx reverse proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - nexus_net

  # ── Certbot SSL ───────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: nexus-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Run manually: docker-compose run certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  app_logs:
  certbot_www:

networks:
  nexus_net:
    driver: bridge
