# ═══════════════════════════════════════════════════════
#  NexusERP — Nginx Reverse Proxy Configuration
#  Place at: /etc/nginx/sites-available/nexus-erp
#  Enable:   ln -s /etc/nginx/sites-available/nexus-erp \
#                   /etc/nginx/sites-enabled/nexus-erp
# ═══════════════════════════════════════════════════════

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# Upstream Next.js app
upstream nexus_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.nexuserp.com www.app.nexuserp.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ──────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.nexuserp.com;

    # ── SSL Certificates (Let's Encrypt / Certbot) ────
    ssl_certificate     /etc/letsencrypt/live/app.nexuserp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nexuserp.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;

    # ── Modern SSL settings ───────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── HSTS ──────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security Headers ──────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;

    # ── Client limits ─────────────────────────────────
    client_max_body_size 10M;

    # ── Static assets (cached aggressively) ───────────
    location /_next/static/ {
        proxy_pass http://nexus_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_cache_valid 200 1y;
        access_log off;
    }

    location /favicon.ico {
        proxy_pass http://nexus_app;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── API routes (rate limited) ─────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://nexus_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Main app ──────────────────────────────────────
    location / {
        proxy_pass http://nexus_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Health check endpoint ─────────────────────────
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ── Block common attack paths ─────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|sh|sql)$ {
        deny all;
    }
}
